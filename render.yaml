services:
  - type: web
    name: freight-email-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./database.sqlite
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CORS_ORIGIN
        value: https://freight-email-frontend.vercel.app
    disk:
      name: database
      mountPath: /opt/render/project/src/backend/database
      sizeGB: 1