services:
  - type: web
    name: freight-email-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: freight-email-secret-key-2024
      - key: PORT
        value: 10000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: priya.c@pasfreight.com
      - key: SMTP_PASSWORD
        value: mnjpruapqynzbagi
      - key: SMTP_FROM_EMAIL
        value: priya.c@pasfreight.com
      - key: CORS_ORIGIN
        value: https://mailbot-phi.vercel.app
      - key: DATABASE_PATH
        value: ./database.sqlite
    disk:
      name: database
      mountPath: /opt/render/project/src/backend/database
      sizeGB: 1