version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freight-email-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/app/backend/database/database.sqlite
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - ./backend/database:/app/backend/database
      - ./backend/uploads:/app/backend/uploads
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped
    networks:
      - freight-network

  nginx:
    image: nginx:alpine
    container_name: freight-email-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - freight-network

networks:
  freight-network:
    driver: bridge